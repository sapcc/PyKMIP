
openapi: 3.0.0
info:
  title: Metadata API for Barbican and KMIP Operations
  version: 1.0.0
paths:
  /get_barbican_id:
    get:
      summary: Fetch the Barbican ID for a given KMIP ID
      parameters:
        - name: kmip_id
          in: query
          required: true
          description: The KMIP ID
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  barbican_id:
                    type: string
        '400':
          description: Missing KMIP ID
        '500':
          description: Internal server error
  /get_kmip_id:
    get:
      summary: Fetch the KMIP ID for a given Barbican ID
      parameters:
        - name: barbican_id
          in: query
          required: true
          description: The Barbican ID
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  kmip_id:
                    type: string
        '400':
          description: Missing Barbican ID
        '500':
          description: Internal server error
  /get_kmip_details:
    get:
      summary: Fetch details for a given KMIP ID
      parameters:
        - name: kmip_id
          in: query
          required: true
          description: The KMIP ID
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  barbican_id:
                    type: string
                  kmip_details:
                    type: object
        '400':
          description: Missing KMIP ID
        '500':
          description: Internal server error
  /update_policy:
    post:
      summary: Update the operation policy for a KMIP object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kmip_id:
                  type: string
                operation_policy_name:
                  type: string
      responses:
        '200':
          description: Policy updated successfully
        '400':
          description: Missing parameters
        '500':
          description: Internal server error
  /update_owner:
    post:
      summary: Update the owner of a KMIP object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kmip_id:
                  type: string
                owner:
                  type: string
      responses:
        '200':
          description: Owner updated successfully
        '400':
          description: Missing parameters
        '500':
          description: Internal server error
  /kmip_register:
    post:
      summary: Register a new KMIP object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                owner:
                  type: string
                policy:
                  type: string
      responses:
        '200':
          description: KMIP object registered successfully
        '400':
          description: Missing parameters
        '500':
          description: Internal server error
  /get_barbican_metadata:
    get:
      summary: Fetch metadata for a given Barbican UUID
      parameters:
        - name: uuid
          in: query
          required: true
          description: The Barbican UUID
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
        '400':
          description: Missing UUID
        '500':
          description: Internal server error
  /update_project_id:
    post:
      summary: Update the project ID for a Barbican secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret_id:
                  type: string
                project_id:
                  type: string
      responses:
        '200':
          description: Project ID updated successfully
        '400':
          description: Missing parameters
        '500':
          description: Internal server error
